[build-system]
# ``breathe/_parser.py`` is generated during the build by
# ``xml_parser_generator``, which requires ``jinja2``.
requires = ["setuptools>=80.9.0", "jinja2>=3.1.6"]
build-backend = "setuptools.build_meta"

# project metadata
[project]
name = "breathe"
description = "Sphinx Doxygen renderer"
readme = "README.rst"
license.text = "BSD-3-Clause"
requires-python = ">=3.9"

# Classifiers list: https://pypi.org/classifiers/
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: Sphinx",
    "Framework :: Sphinx :: Extension",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Documentation :: Sphinx",
    "Topic :: Software Development",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]
dependencies = [
    "Sphinx>=7.2",
]
dynamic = ["version"]

[project.optional-dependencies]
docs = [
    "furo",
    "sphinx-copybutton",
    "sphinxcontrib-spelling",
]
lint = [
    "ruff==0.16.8",
    "mypy>=1,<1.10",
    "types-docutils",
    "types-Pygments",
    "pytest>=8.0,<9",  # for mypy
    "sphinxcontrib-phpdomain",  # for mypy
    # The API that we depend on is only implemented in rogerbarton's fork of sphinx-csharp
    # and not in the one that is published to PyPI. But we can't publish Breathe to PyPI with
    # a listed git dependency so we comment it out for the moment
    # "sphinx-csharp @ git+https://github.com/rogerbarton/sphinx-csharp.git",  # for mypy
]
test = [
    "pytest>=8.0,<9",
    "Sphinx[test]"
]

[project.urls]
Changelog = "https://github.com/breathe-doc/breathe/blob/main/CHANGELOG.rst"
Code = "https://github.com/breathe-doc/breathe/"
Download = "https://pypi.org/project/breathe/"
Documentation = "https://breathe.readthedocs.io/"
Homepage = "https://www.breathe-doc.org/"
"Issue tracker" = "https://github.com/breathe-doc/breathe/issues"

[[project.authors]]
name = "Michael Jones"
email = "m.pricejones@gmail.com"

[project.scripts]
breathe-apidoc = "breathe.apidoc:main"

# The `_parser.py` module is generated from `xml_parser_generator/schema.json`
# by the custom `build_py` command below. It is part of the `breathe` package
# data and is (re)generated opportunistically at build time rather than being
# committed to the repository.
[tool.setuptools]
packages = [
    "breathe",
    "breathe.directives",
    "breathe.finder",
    "breathe.renderer",
    "xml_parser_generator",
]
include-package-data = true

[tool.setuptools.cmdclass]
build_py = "breathe._build.CustomBuildPy"

[tool.setuptools.package-data]
breathe = ["_parser.py"]
xml_parser_generator = ["schema.json", "module_template.py.in", "make_parser.py"]

[tool.setuptools.dynamic]
version = {attr = "breathe.__version__"}

[tool.mypy]
files = [
    "breathe",
    "examples",
    "tests",
]
show_column_numbers = true
show_error_context = true
python_version = "3.9"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# TODO: Remove if possible
[[tool.mypy.overrides]]
module = [
    "breathe.parser.compound",
    "breathe.parser.compoundsuper",
    "breathe.parser.index",
    "breathe.parser.indexsuper",
]
ignore_errors = true
