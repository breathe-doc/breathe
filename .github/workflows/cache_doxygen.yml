name: download and cache Doxygen
on:
  workflow_call
jobs:
  install:
    runs-on: ubuntu-latest
    concurrency:
      group: linux-doxygen-${{ matrix.doxygen-version }}-cache
    strategy:
      fail-fast: false
      matrix:
        doxygen-version: ['1.9.4', '1.9.7']
    steps:
      - uses: actions/cache/restore@v5
        id: cache-doxygen
        with:
          path: doxygen-bin-arc
          # Increment version suffix to break cache if needed
          key: ${{ runner.os }}-doxygen-${{ matrix.doxygen-version }}-v1
          lookup-only: true
          restore-keys: |
            ${{ runner.os }}-doxygen-

      - name: download Doxygen from GitHub Releases
        if: steps.cache-doxygen.outputs.cache-hit != 'true'
        run: |
          mkdir doxygen-bin-arc && cd doxygen-bin-arc
          version_underscores=$(echo ${{ matrix.doxygen-version }} | tr "." "_")
          curl -L https://github.com/doxygen/doxygen/releases/download/Release_${version_underscores}/doxygen-${{ matrix.doxygen-version }}.linux.bin.tar.gz > doxygen.tar.gz

      - uses: actions/cache/save@v5
        if: steps.cache-doxygen.outputs.cache-hit != 'true'
        with:
          path: doxygen-bin-arc
          key: ${{ steps.cache-doxygen.outputs.cache-primary-key }}
